# Render Blueprint - https://render.com
# GitHub 저장소를 Render 에 연결하면 이 파일대로 자동 배포된다.
services:
  - type: web
    name: compressor-remote
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: COMPRESSOR_SECRET_KEY
        generateValue: true      # Render 가 랜덤 생성 (세션 유지)
      - key: COMPRESSOR_RESET_USERS
        value: "1"               # 임시디스크라 매 부팅 시 기본계정(admin/admin1234 등) 보장
                                 # 영구디스크로 계정 유지하려면 이 값을 지우세요
      - key: COMPRESSOR_DB_PATH
        value: /tmp/compressor.db   # 소스 폴더 대신 빠른 임시 디스크에 DB
      - key: COMPRESSOR_POLL_INTERVAL
        value: "5"               # 저사양 인스턴스 부하/락 완화 (기본 2초 -> 5초)
      # 영구 저장이 필요하면 유료 디스크 추가:
      # - key: COMPRESSOR_DB_PATH
      #   value: /var/data/compressor.db  (아래 disks 와 함께)
# 유료 디스크 예시:
# disks:
#   - name: data
#     mountPath: /var/data
#     sizeGB: 1
