<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임가공 발주서 작성기</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --sub:#5b6475; --line:#d9dde4;
          --brand:#1f5fbf; --ok:#1a7f37; --warn:#b7791f; --warnbg:#fff7e0; --err:#c0392b; --head:#e8f5e9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; font-size:14px; }
  header { background:#16325c; color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12px; opacity:.8; }
  main { max-width:1180px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  input[type=file], input[type=number], input[type=text], textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .hint { color:var(--sub); font-size:12px; margin-top:4px; }
  button, .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:6px;
                 padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn.alt { background:#4a5568; }
  .err { background:#fdecea; color:var(--err); border:1px solid #f5c6c0; padding:10px; border-radius:6px; margin-bottom:12px; }
  .warn { background:var(--warnbg); color:#7a5200; border:1px solid #f1d58a; padding:10px; border-radius:6px; margin:8px 0; }
  .ok { color:var(--ok); font-weight:700; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi div { border:1px solid var(--line); border-radius:8px; padding:10px; background:#fafbfc; }
  .kpi b { display:block; font-size:22px; }
  .kpi span { color:var(--sub); font-size:12px; }
  .tbl { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border:1px solid var(--line); padding:5px 7px; text-align:left; vertical-align:top; white-space:nowrap; }
  th { background:var(--head); position:sticky; top:0; }
  td.n { text-align:right; }
  tr.unreg td { background:var(--warnbg); }
  td.memo { white-space:pre-line; min-width:180px; }
  ul.rules { margin:6px 0 0; padding-left:18px; color:var(--sub); }
  details summary { cursor:pointer; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>임가공 발주서(수삽) 자동 작성</h1>
  <p>생산계획서 업로드 → 수삽 탭 일자별 납품모델(DATE · MODEL · BUYER · Q'TY) 갱신 · SMD 탭은 자동수식</p>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
